name: API Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  resolve-e2e-revisions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend_sha: ${{ steps.refs.outputs.frontend_sha }}
      integration_sha: ${{ steps.refs.outputs.integration_sha }}
    steps:
      - name: Resolve E2E revisions
        id: refs
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
        run: |
          frontend_sha="$(gh api "repos/${{ github.repository_owner }}/jyatesdotdev-frontend/commits/main" --jq '.sha')"
          integration_sha="$(gh api "repos/${{ github.repository_owner }}/jyatesdotdev-integration/commits/main" --jq '.sha')"
          echo "frontend_sha=$frontend_sha" >> "$GITHUB_OUTPUT"
          echo "integration_sha=$integration_sha" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-e2e-revisions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Checkout integration
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/jyatesdotdev-integration
          ref: ${{ needs.resolve-e2e-revisions.outputs.integration_sha }}
          path: jyatesdotdev-integration
          token: ${{ secrets.INFRA_REPO_PAT }}
          persist-credentials: false

      - name: Checkout API
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: jyatesdotdev-api

      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/jyatesdotdev-frontend
          ref: ${{ needs.resolve-e2e-revisions.outputs.frontend_sha }}
          path: jyatesdotdev-frontend

      - name: Report tested revisions
        run: |
          git -C jyatesdotdev-integration rev-parse HEAD
          git -C jyatesdotdev-api rev-parse HEAD
          git -C jyatesdotdev-frontend rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: jyatesdotdev-api/backend/go.mod
          cache-dependency-path: jyatesdotdev-api/backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            jyatesdotdev-integration/package-lock.json
            jyatesdotdev-frontend/spa/package-lock.json

      - name: Install frontend dependencies
        working-directory: jyatesdotdev-frontend/spa
        run: npm ci

      - name: Install integration dependencies
        working-directory: jyatesdotdev-integration
        run: npm ci

      - name: Install Chromium
        working-directory: jyatesdotdev-integration
        run: npx playwright install --with-deps chromium

      - name: Typecheck integration suite
        working-directory: jyatesdotdev-integration
        run: npm run typecheck

      - name: Run E2E tests
        working-directory: jyatesdotdev-integration
        run: npm run e2e
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: jyatesdotdev-integration/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Lambdas
        working-directory: backend
        run: |
          mkdir -p bin/admin bin/authorizer bin/contact bin/interactions bin/notifications
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bin/admin/bootstrap cmd/admin/main.go
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bin/authorizer/bootstrap cmd/authorizer/main.go
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bin/contact/bootstrap cmd/contact/main.go
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bin/interactions/bootstrap cmd/interactions/main.go
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bin/notifications/bootstrap cmd/notifications/main.go

      - name: Package Lambdas
        working-directory: backend
        run: |
          zip -j admin.zip bin/admin/bootstrap
          zip -j authorizer.zip bin/authorizer/bootstrap
          zip -j contact.zip bin/contact/bootstrap
          zip -j interactions.zip bin/interactions/bootstrap
          zip -j notifications.zip bin/notifications/bootstrap

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Upload to S3
        run: |
          S3_KEY_PREFIX="lambdas/${{ github.sha }}"
          aws s3 cp backend/admin.zip s3://${{ vars.ARTIFACTS_BUCKET }}/${S3_KEY_PREFIX}/admin.zip
          aws s3 cp backend/authorizer.zip s3://${{ vars.ARTIFACTS_BUCKET }}/${S3_KEY_PREFIX}/authorizer.zip
          aws s3 cp backend/contact.zip s3://${{ vars.ARTIFACTS_BUCKET }}/${S3_KEY_PREFIX}/contact.zip
          aws s3 cp backend/interactions.zip s3://${{ vars.ARTIFACTS_BUCKET }}/${S3_KEY_PREFIX}/interactions.zip
          aws s3 cp backend/notifications.zip s3://${{ vars.ARTIFACTS_BUCKET }}/${S3_KEY_PREFIX}/notifications.zip
          
          echo "admin_key=${S3_KEY_PREFIX}/admin.zip" >> $GITHUB_ENV
          echo "authorizer_key=${S3_KEY_PREFIX}/authorizer.zip" >> $GITHUB_ENV
          echo "contact_key=${S3_KEY_PREFIX}/contact.zip" >> $GITHUB_ENV
          echo "interactions_key=${S3_KEY_PREFIX}/interactions.zip" >> $GITHUB_ENV
          echo "notifications_key=${S3_KEY_PREFIX}/notifications.zip" >> $GITHUB_ENV

      - name: Trigger Infra Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: ${{ github.repository_owner }}/jyatesdotdev-infra
          event-type: deploy_api
          client-payload: |
            {
              "artifact_bucket": "${{ vars.ARTIFACTS_BUCKET }}",
              "admin_lambda_key": "${{ env.admin_key }}",
              "authorizer_lambda_key": "${{ env.authorizer_key }}",
              "contact_lambda_key": "${{ env.contact_key }}",
              "interactions_lambda_key": "${{ env.interactions_key }}",
              "notifications_lambda_key": "${{ env.notifications_key }}"
            }
